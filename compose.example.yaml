services:
  chat-runtime:
    image: replace-with-registry/chat-runtime:replace-with-version
    restart: unless-stopped
    environment:
      CHAT_RUNTIME_INSTALLATION_ID: ${CHAT_RUNTIME_INSTALLATION_ID}
      CHAT_RUNTIME_CONTROL_PLANE_URL: ${CHAT_RUNTIME_CONTROL_PLANE_URL}
      CHAT_RUNTIME_SHARED_SECRET: ${CHAT_RUNTIME_SHARED_SECRET}
      CHAT_RUNTIME_ADMIN_MODE: ${CHAT_RUNTIME_ADMIN_MODE:-false}
      CHAT_RUNTIME_DISCORD_ENABLED: ${CHAT_RUNTIME_DISCORD_ENABLED:-false}
      CHAT_RUNTIME_TELEGRAM_ENABLED: ${CHAT_RUNTIME_TELEGRAM_ENABLED:-false}
      CHAT_RUNTIME_SLACK_ENABLED: ${CHAT_RUNTIME_SLACK_ENABLED:-false}
      CHAT_RUNTIME_CAPABILITIES: ${CHAT_RUNTIME_CAPABILITIES}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_GUILD_IDS: ${DISCORD_GUILD_IDS:-}
      DISCORD_INTENTS: ${DISCORD_INTENTS:-}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_ALLOWED_CHANNEL_IDS: ${SLACK_ALLOWED_CHANNEL_IDS:-}
